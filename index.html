<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skim</title>
<meta name="description" content="Latest headlines from a fixed set of sources. Text only.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238f98ff'/%3E%3Ctext x='16' y='23' font-size='20' font-family='serif' font-weight='700' text-anchor='middle' fill='%230a0e1f'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500;600&display=swap">
<script>
try { var t = localStorage.getItem('skim.theme'); t = t ? JSON.parse(t) : null; } catch (e) { t = null; }
document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
</script>
<style>
:root { --bg:#f8f8f5; --fg:#15171f; --mut:#6a6f85; --line:#e1e2e9; --acc:#4650d6; --on-acc:#fff; --panel:#fff; --hl:#eceefc; color-scheme:light }
:root[data-theme=dark] { --bg:#0a0e1f; --fg:#f2f3fa; --mut:#8b91ab; --line:#1d2543; --acc:#9aa3ff; --on-acc:#0a0e1f; --panel:#10172e; --hl:#141c3a; color-scheme:dark }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased }
.wrap { max-width:1180px; margin:0 auto; padding:0 16px }
a { color:inherit; text-decoration:none }
button, input, select { font:inherit; color:inherit }
select.btn { background:var(--bg); appearance:auto }
button { cursor:pointer }
:focus-visible { outline:2px solid var(--acc); outline-offset:2px }

.top { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid transparent }
.top .wrap { display:flex; align-items:center; gap:10px; padding-top:16px; padding-bottom:12px }
.logo { font:600 26px Lora,serif; letter-spacing:-.01em; margin-right:auto }
.br { display:none }
.logo i { color:var(--acc); font-style:normal }
#upd { color:var(--mut); font-size:13px }
.btn { background:none; border:1px solid var(--line); border-radius:8px; padding:7px 14px; font-size:13px; font-weight:500 }
.btn:hover { border-color:var(--mut) }
.btn.pri { background:var(--acc); color:var(--on-acc); border-color:var(--acc) }
.btn:disabled { opacity:.5; cursor:default }

.search { position:relative; margin:4px 0 22px }
.search input { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px 48px 15px 46px; font-size:16px }
.search input::placeholder { color:var(--mut) }
.search svg { position:absolute; left:16px; top:50%; translate:0 -50%; width:18px; height:18px; stroke:var(--mut); fill:none; stroke-width:2 }
.search kbd { position:absolute; right:14px; top:50%; translate:0 -50%; border:1px solid var(--line); border-radius:5px; padding:1px 7px; font:12px Inter,sans-serif; color:var(--mut) }

.tabs { display:flex; gap:26px; overflow-x:auto; border-bottom:1px solid var(--line); margin-bottom:18px; scrollbar-width:none }
.tabs button { background:none; border:0; border-bottom:2px solid transparent; padding:2px 0 14px; margin-bottom:-1px; color:var(--mut); white-space:nowrap }
.tabs button:hover { color:var(--fg) }
.tabs button[aria-pressed=true] { color:var(--fg); border-color:var(--acc) }

[hidden] { display:none !important }
#srcwrap { display:grid; grid-template-rows:1fr; transition:grid-template-rows .3s ease, margin-bottom .3s ease; margin-bottom:16px }
#srcwrap.closed { grid-template-rows:0fr; margin-bottom:0 }
#srcs { min-height:0; overflow:hidden; display:flex; flex-wrap:wrap; padding:0 1px 1px 0 }
#srcwrap.closed #srcs { visibility:hidden; transition:visibility 0s .3s }
#srcs .sq { flex:1 1 150px; min-width:0; display:flex; align-items:center; gap:9px; background:var(--bg); color:var(--mut); border:1px solid var(--line); border-radius:0; margin:0 -1px -1px 0; padding:11px 12px; font-size:13px; text-align:left }
#srcs .sq span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
#srcs .sq::before { content:''; flex:none; width:7px; height:7px; border-radius:50%; border:1.5px solid currentColor; transition:background-color .2s, border-color .2s }
#srcs .sq:hover { color:var(--fg); border-color:var(--mut); position:relative }
#srcs .sq[aria-pressed=true] { background:var(--hl); color:var(--fg) }
#srcs .sq[aria-pressed=true]::before { background:var(--acc); border-color:var(--acc) }
#srcs .sq.ooc { opacity:.5 }
#srcs .sq:focus-visible { outline-offset:-2px }
.mini, .hd { background:none; border:0; padding:4px 2px; font-size:13px; color:var(--mut) }
.mini:hover, .hd:hover { color:var(--fg) }
.hd { color:var(--fg); font-weight:500; margin-right:4px }
#view { display:flex; align-items:center; gap:12px; margin-bottom:14px }
#view .sp { margin-left:auto }
.seg { display:inline-flex; flex:none; border:1px solid var(--line); border-radius:8px; overflow:hidden }
.seg button { background:none; border:0; padding:5px 12px; font-size:13px; color:var(--mut) }
.seg button[aria-pressed=true] { background:var(--hl); color:var(--fg) }
.pick { flex:none; background:var(--acc); color:var(--on-acc); border:0; border-radius:999px; padding:4px 11px; font-size:13px }
#grid.flat { columns:auto; max-width:860px; margin:0 auto }
.flat .row { grid-template-columns:52px 1fr }
.src { display:block; margin-top:3px; padding:0; background:none; border:0; font-size:12px; color:var(--mut); text-align:left }
.src:hover { color:var(--fg); text-decoration:underline }
#kws { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:26px }
#kws:empty { display:none }
#kws span { font-size:12px; color:var(--mut); margin-right:4px }
#kws button { background:none; border:1px solid var(--line); border-radius:999px; padding:4px 11px; font-size:13px }
#kws button:hover { border-color:var(--mut) }
#kws button small { color:var(--mut); margin-left:5px; font-size:11px }
#kws button[aria-pressed=true] { background:var(--acc); border-color:var(--acc); color:var(--on-acc) }
#kws button[aria-pressed=true] small { color:inherit }
/* columns (not grid) so a folded card lets the one below it move up */
#grid { columns:300px; column-gap:42px; padding-bottom:64px }
.card { border-top:2px solid var(--fg); min-width:0; break-inside:avoid; margin-bottom:40px }
.card header { display:flex; align-items:center; gap:14px; padding:12px 0 10px }
.card header { cursor:pointer }
.card header::before { content:'▾'; display:inline-block; color:var(--mut); font-size:12px; margin-right:-4px; transition:transform .25s ease }
.card.closed header::before { transform:rotate(-90deg) }
.body { display:grid; grid-template-rows:1fr; transition:grid-template-rows .3s ease }
.inner { min-height:0; overflow:hidden; transition:visibility 0s }
.card.closed .body { grid-template-rows:0fr }
.card.closed .inner { visibility:hidden; transition:visibility 0s .3s }
.card.closed { margin-bottom:12px }
.card h2 { margin:0 auto 0 0; font-size:14px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.modes { display:flex; flex-wrap:wrap; gap:4px 14px; padding:0 0 8px }
.mode { background:none; border:0; padding:0; font-size:12px; color:var(--mut); border-bottom:1px solid transparent }
.mode[aria-pressed=true] { color:var(--fg); border-color:var(--fg) }
.menu { position:relative }
.menu summary { list-style:none; cursor:pointer; color:var(--mut); letter-spacing:1px; line-height:1 }
.menu summary::-webkit-details-marker { display:none }
.menu div { position:absolute; right:0; top:22px; z-index:3; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px; min-width:150px; box-shadow:0 8px 24px #0004 }
.menu div button { display:block; width:100%; text-align:left; background:none; border:0; padding:8px 10px; border-radius:6px; font-size:13px }
.menu div button:hover { background:var(--hl) }

.list { max-height:540px; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--line) transparent }
.row { display:grid; grid-template-columns:52px 1fr; gap:0 8px; padding:9px 10px 9px 0; margin-left:0; border-bottom:1px solid var(--line); border-radius:8px }
.row:last-of-type { border-bottom-color:transparent }
.t { position:relative; padding-left:12px; font-size:13px; color:var(--mut); padding-top:3px }
.t::before { content:''; position:absolute; left:0; top:4px; height:16px; width:3px; border-radius:2px; background:#f97316; transition:background-color .25s }
.row a { font:500 17px/1.3 Lora,serif }
.a1 .t::before { opacity:.65 } .a2 .t::before { opacity:.3 }
.row.read .t::before { background:var(--mut); opacity:.5 }
.row:has(a:focus-visible) { background:var(--hl); box-shadow:-8px 0 0 var(--hl); border-color:transparent }
.row a:focus-visible { outline:0; color:var(--acc) }
.foot, .err, .empty { font-size:13px; color:var(--mut); padding-top:10px }
.foot a:hover, .err a { color:var(--fg); text-decoration:underline }
.empty { column-span:all; text-align:center; padding:48px 0 }

dialog { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:14px; padding:22px; width:min(520px,calc(100vw - 32px)) }
dialog::backdrop { background:#0008 }
dialog h3 { margin:0 0 14px; font:600 20px Lora,serif }
dialog label { display:block; font-size:12px; color:var(--mut); margin:12px 0 4px }
dialog input, dialog textarea { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 11px }
dialog textarea { height:84px; font:12px ui-monospace,monospace; resize:vertical }
#msg { min-height:20px; font-size:13px; color:var(--mut); margin:10px 0 0 }
#pv { margin:6px 0 0; padding:0; list-style:none; font:500 14px/1.35 Lora,serif }
#pv li { padding:5px 0; border-bottom:1px solid var(--line) }
.acts { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap }
.acts .sp { margin-left:auto }
#hid { font-size:13px; color:var(--mut); margin-top:14px }
#hid button { background:none; border:0; text-decoration:underline; padding:0 6px 0 4px }

/* motion */
@keyframes in { from { opacity:0; transform:translateY(8px) } }
@keyframes pop { from { opacity:0; transform:translateY(-4px) scale(.97) } }
@keyframes fade { from { opacity:0 } }
.enter .card, .flat.enter .row:nth-child(-n+40), .enter .empty { animation:in .4s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(min(var(--i,14),14) * 28ms) }
.menu[open] div { animation:pop .15s ease-out }
dialog[open] { animation:pop .22s cubic-bezier(.2,.7,.2,1) }
dialog[open]::backdrop { animation:fade .22s }
#grid { transition:opacity .25s }
#grid.loading { opacity:.45; pointer-events:none }
.top.scrolled { border-bottom-color:var(--line) }
.search input:focus { outline:0; border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent) }
.row:hover { background:var(--hl) }
.btn:active, #view button:active, #kws button:active { transform:scale(.96) }
body, .top, .btn, .search input, .search kbd, .tabs button, .seg button, #kws button, #srcs .sq, .mini, .hd, .pick, .mode, .menu div button, .row, dialog, dialog input, dialog textarea { transition:background-color .25s, color .25s, border-color .25s, box-shadow .25s, opacity .25s, transform .15s }
.card { transition:margin-bottom .3s ease, border-color .25s }
/* extra motion: transform/opacity only, so it stays on the compositor */
@keyframes drop { from { opacity:0; transform:translateY(-10px) } }
@keyframes pulse { 50% { opacity:.25 } }
@keyframes tick { 40% { transform:scaleY(1.9) } }
@keyframes pop2 { from { opacity:0; transform:scale(.85) } }
.top { animation:drop .5s cubic-bezier(.2,.7,.2,1) both }
.search, .tabs, #view, #kws { animation:in .55s cubic-bezier(.2,.7,.2,1) both }
.search { animation-delay:.06s } .tabs { animation-delay:.12s } #view { animation-delay:.18s } #kws { animation-delay:.24s }
.logo { transition:transform .3s cubic-bezier(.3,1.6,.5,1) } .logo:hover { transform:rotate(-3deg) scale(1.06) }
.btn, #view button, #kws button { transition-property:background-color, color, border-color, box-shadow, opacity, transform }
.btn:hover, #kws button:hover { transform:translateY(-1px) }
.tabs button { position:relative; border-bottom-color:transparent !important }
.tabs button::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--acc); transform:scaleX(0); transition:transform .3s cubic-bezier(.2,.7,.2,1) }
.tabs button[aria-pressed=true]::after { transform:scaleX(1) }
#srcs .sq { transition-property:background-color, color, border-color, box-shadow, opacity, transform }
#srcs .sq:hover { transform:translateY(-2px) } #srcs .sq:active { transform:scale(.92) }
.row a { background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat; transition:background-size .35s cubic-bezier(.2,.7,.2,1), color .25s }
.row:hover a { background-size:100% 1px }
.t::before { transform-origin:center; transition:background-color .25s, opacity .25s, transform .25s cubic-bezier(.3,1.6,.5,1) }
.row:hover .t::before { transform:scaleY(1.3) }
.row.read.just .t::before { animation:tick .45s ease-out }
.src { transition:color .2s, transform .2s } .src:hover { color:var(--fg); transform:translateX(2px) }
#grid.loading { animation:pulse 1.1s ease-in-out infinite }
@media (prefers-reduced-motion:reduce) { *, ::before, ::after { animation:none !important; transition:none !important } }

@media (max-width:640px) {
  #upd { display:none }
  .top .wrap { flex-wrap:wrap; padding-top:12px; padding-bottom:8px }
  .logo { order:0 } #addbtn { order:1 }
  .br { display:block; order:2; flex-basis:100%; height:0 }
  #refresh, #fold, #limit, #theme { order:3 }
  #refresh { margin-right:auto }
  .btn { padding:7px 10px }
  .search { margin-bottom:14px }
  .search input { padding:12px 40px 12px 42px }
  .search kbd { display:none }
  .tabs { gap:20px; margin-bottom:14px }
  #view { flex-wrap:wrap; gap:4px 10px }
  #view .sp { display:none }
  .seg button { padding:5px 10px }
  #kws { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin-bottom:18px }
  #kws > * { flex:none }
  .list { max-height:none; overflow:visible } /* page scrolls instead of nested boxes; use the count menu to show more */
  .row a { font-size:16px }
  .card header { padding:14px 0 12px }
  .card.closed header { padding-bottom:14px }
  .card { border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:0 }
}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="logo">Skim<i>.</i></div>
  <span id="upd"></span>
  <span class="br"></span>
  <button class="btn" id="refresh">Refresh</button>
  <button class="btn" id="fold"></button>
  <select class="btn" id="limit" aria-label="Headlines per source" title="Headlines per source"><option value="5">5</option><option value="8">8</option><option value="15">15</option><option value="30">30</option><option value="50">50</option><option value="100">100</option></select>
  <button class="btn" id="theme"></button>
  <button class="btn pri" id="addbtn">Add source</button>
</div></div>

<main class="wrap">
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search headlines" aria-label="Search headlines" autocomplete="off">
    <kbd aria-hidden="true">/</kbd>
  </div>
  <nav class="tabs" id="tabs" aria-label="Categories"></nav>
  <div id="view"></div>
  <div id="srcwrap"><div id="srcs"></div></div>
  <div id="kws" aria-label="Trending keywords"></div>
  <div id="grid" aria-live="polite"><p class="empty">Loading…</p></div>
</main>

<dialog id="panel">
  <h3>Add source</h3>
  <label for="u">Site or feed URL</label>
  <input id="u" type="text" inputmode="url" placeholder="example.com or https://example.com/feed.xml" autocomplete="off">
  <label for="c">Category</label>
  <input id="c" list="cats" placeholder="Pick one or type a new one" autocomplete="off"><datalist id="cats"></datalist>
  <label for="n">Name (optional)</label>
  <input id="n" type="text" autocomplete="off">
  <p id="msg"></p>
  <ul id="pv"></ul>
  <div class="acts">
    <button class="btn pri" id="add" disabled>Add</button>
    <button class="btn" id="close">Close</button>
    <button class="btn sp" id="export">Export</button>
    <button class="btn" id="import">Import</button>
  </div>
  <label for="io">Export / import (JSON list of your added sources)</label>
  <textarea id="io" spellcheck="false"></textarea>
  <div id="hid"></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const h = (t, p = {}, ...k) => { const e = Object.assign(document.createElement(t), p); e.append(...k); return e; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('skim.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('skim.' + k, JSON.stringify(v)); } catch {} },
};
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
async function getJSON(url) {
  const r = await fetch(url);
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.error || 'HTTP ' + r.status);
  return b;
}

let cards = [], mine = store.get('mine', []), over = store.get('over', {}), cat = store.get('cat', 'All');
const mode = {};
// links opened this browser session get a dot; sessionStorage keeps it across a refresh
const read = new Set((() => { try { return JSON.parse(sessionStorage.getItem('skim.read') || '[]'); } catch { return []; } })());
const markRead = (row, url) => {
  read.add(url); row.classList.add('read', 'just');
  try { sessionStorage.setItem('skim.read', JSON.stringify([...read])); } catch {}
};
const narrow = () => innerWidth < 640;
const openSet = new Set();
const known = new Set();
const paintFold = () => $('#fold').textContent = visible.some(u => openSet.has(u)) ? 'Fold all' : 'Unfold all';
let seeded = false, visible = [], kw = '', srcPick = '';
let view = store.get('view', 'list'), enterT;
let period = +store.get('period', 0), seed = Math.random(); // 0 = newest, else days to draw a random pick from
const off = new Set(store.get('off', [])); // urls of sources switched off
let srcsOpen = store.get('srcsOpen', false);
let limit = store.get('limit', innerWidth < 640 ? 8 : 30);
const eff = c => { const o = over[c.url] || {}; return { ...c, name: o.name || c.source, category: o.category || c.category, type: o.type || c.type, hidden: !!o.hidden }; };
const saveOver = () => store.set('over', over);
const saveMine = () => store.set('mine', mine);

const ago = iso => {
  const m = (Date.now() - Date.parse(iso)) / 6e4;
  return m < 60 ? Math.max(1, Math.round(m)) + 'm' : m < 1440 ? Math.floor(m / 60) + 'h' : Math.floor(m / 1440) + 'd';
};

async function load(fresh) {
  $('#refresh').disabled = true;
  $('#grid').classList.add('loading');
  const bust = fresh ? '&r=' + Math.floor(Date.now() / 6e4) : '';
  const [d, m] = await Promise.allSettled([
    getJSON('/api/feeds?' + bust),
    mine.length ? getJSON('/api/feeds?extra=' + encodeURIComponent(JSON.stringify(mine)) + bust) : [],
  ]);
  cards = [...(d.value || []), ...(m.value || []).map(c => ({ ...c, mine: true }))];
  if (d.status === 'rejected') $('#grid').replaceChildren(h('p', { className: 'empty' }, "Couldn't load feeds. ", h('a', { href: '#', onclick: e => { e.preventDefault(); load(true); } }, 'Retry')));
  else { $('#upd').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); render(true); }
  $('#grid').classList.remove('loading');
  $('#refresh').disabled = false;
}

const modeOf = c => { const ms = Object.keys(c.modes || {}); return ms.includes(mode[c.url]) ? mode[c.url] : ms[0]; };

// the headlines a card shows before search / keyword filters: deduped, newest first for Latest, capped by the count menu
function itemsOf(c) {
  const m = modeOf(c), seen = new Set();
  const items = (c.modes?.[m] || []).filter(i => /^https?:\/\//i.test(i.url) && !seen.has(i.url) && seen.add(i.url));
  if (m === 'Latest') items.sort((a, b) => (Date.parse(b.publishedAt) || 0) - (Date.parse(a.publishedAt) || 0));
  return items.slice(0, limit);
}

const STOP = new Set(('a an the and or but if of in on at to for from by with without as is are was were be been being it its this that these those he she they them his her their our your you we i us my me do does did not no so up down out off over under into than then too very can could would should may might will just more most some any all per via vs amid about after before again against also back here there how what when where which who whom why while new news says say said get gets make makes made first last year years day days week now one two three still only other many much like take takes set sets show shows live update updates report reports big top plan plans want wants need needs people time next latest see look looks ahead behind among between because during since until through its it\'s what\'s').split(' '));
const words = title => new Set((title.toLowerCase().match(/[\p{L}\p{N}][\p{L}\p{N}'’]*/gu) || []).map(w => w.replace(/['’]s$/, '')).filter(w => w.length > 1 && !STOP.has(w) && !/^\d+$/.test(w)));

function keywords(cs) {
  const n = new Map();
  for (const c of cs) if (!c.error) for (const i of itemsOf(c)) for (const w of words(i.title)) n.set(w, (n.get(w) || 0) + 1);
  const top = [...n].filter(([, k]) => k >= 3).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).slice(0, 14);
  if (kw && !top.some(([w]) => w === kw)) top.unshift([kw, n.get(kw) || 0]);
  return top;
}

function cardEl(c, q) {
  const modes = Object.keys(c.modes || {});
  const m = modeOf(c);
  const el = h('section', { className: 'card' });
  const menu = h('details', { className: 'menu' }, h('summary', { textContent: '···', ariaLabel: 'Source menu' }), h('div', {},
    h('button', { textContent: 'Rename', onclick: () => edit(c, 'name', 'Rename source', c.name) }),
    h('button', { textContent: 'Move category', onclick: () => edit(c, 'category', 'Move to category', c.category) }),
    h('button', { textContent: c.type === 'aggregator' ? 'Mark as publisher' : 'Mark as aggregator', onclick: () => {
      over[c.url] = { ...over[c.url], type: c.type === 'aggregator' ? 'publisher' : 'aggregator' }; saveOver(); render();
    } }),
    h('button', { textContent: c.mine ? 'Remove' : 'Hide', onclick: () => {
      if (c.mine) { mine = mine.filter(x => x.url !== c.url); delete over[c.url]; saveMine(); cards = cards.filter(x => x !== c.raw); }
      else over[c.url] = { ...over[c.url], hidden: true };
      saveOver(); render();
    } })));
  const hd = h('header', {}, h('h2', { textContent: c.name }), menu);
  el.append(hd);
  el.dataset.url = c.url;
  const inner = h('div', { className: 'inner' });
  el.append(h('div', { className: 'body' }, inner));
  el.classList.toggle('closed', !q && !openSet.has(c.url));
  hd.onclick = e => {
    if (e.target.closest('.menu')) return;
    const open = openSet.has(c.url);
    open ? openSet.delete(c.url) : openSet.add(c.url);
    el.classList.toggle('closed', open); // no re-render, so the height can animate
    paintFold();
  };
  if (modes.length > 1) inner.append(h('div', { className: 'modes' }, ...modes.map(k => h('button', { className: 'mode', textContent: k, ariaPressed: k === m, onclick: () => { mode[c.url] = k; render(); } }))));
  if (c.error) {
    if (q || kw) return null;
    inner.append(h('p', { className: 'err' }, "Couldn't load · ", h('a', { href: '#', onclick: e => { e.preventDefault(); load(true); } }, 'retry')));
    return el;
  }
  let items = itemsOf(c);
  if (q) items = items.filter(i => i.title.toLowerCase().includes(q));
  if (kw) items = items.filter(i => words(i.title).has(kw));
  if (!items.length) return q || kw ? null : (inner.append(h('p', { className: 'err', textContent: 'No items' })), el);
  const list = h('div', { className: 'list' });
  inner.append(list);
  for (const i of items) {
    const hrs = i.publishedAt ? (Date.now() - Date.parse(i.publishedAt)) / 36e5 : 6;
    list.append(h('div', { className: 'row a' + (hrs < 3 ? 0 : hrs < 12 ? 1 : 2) + (read.has(i.url) ? ' read' : '') },
      h('span', { className: 't', textContent: i.publishedAt ? ago(i.publishedAt) : '' }),
      h('a', { href: i.url, target: '_blank', rel: 'noopener noreferrer', textContent: i.title,
        onclick: e => markRead(e.currentTarget.parentNode, i.url), onauxclick: e => markRead(e.currentTarget.parentNode, i.url) })));
  }
  let site = c.site; try { site = site || new URL(c.url).origin; } catch {}
  inner.append(h('div', { className: 'foot' }, h('a', { href: site, target: '_blank', rel: 'noopener noreferrer', textContent: 'Open ' + c.name })));
  return el;
}

// random pick from the last `days`, drawing on every mode of every shown source; stable until re-rolled
// shortcut: feeds reach back only a few days, so the month pool is mostly sources with Week/Month modes
function randomOf(cs, days) {
  const seen = new Set(), items = [], cutoff = Date.now() - days * 864e5;
  const key = u => { let x = seed * 1e9; for (const ch of u) x = (x * 31 + ch.charCodeAt(0)) % 1e9; return x; };
  for (const c of cs) if (!c.error) for (const l of Object.values(c.modes || {})) for (const i of l)
    if (/^https?:\/\//i.test(i.url) && Date.parse(i.publishedAt) >= cutoff && !seen.has(i.url)) { seen.add(i.url); items.push({ ...i, src: c }); }
  return items.sort((a, b) => key(a.url) - key(b.url)).slice(0, limit);
}

function listEl(cs, q) {
  const seen = new Set();
  let items = [];
  if (period) items = randomOf(cs, period);
  else {
    for (const c of cs) if (!c.error) for (const i of itemsOf(c)) if (!seen.has(i.url)) { seen.add(i.url); items.push({ ...i, src: c }); }
    items.sort((a, b) => (Date.parse(b.publishedAt) || 0) - (Date.parse(a.publishedAt) || 0));
  }
  const box = h('div');
  const failed = cs.filter(c => c.error).length;
  if (failed && !q && !kw && !srcPick) box.append(h('p', { className: 'err' }, failed + " source" + (failed > 1 ? 's' : '') + " couldn't load · ", h('a', { href: '#', onclick: e => { e.preventDefault(); load(true); } }, 'retry')));
  const rows = items.filter(i => (!srcPick || i.src.url === srcPick) && (!q || i.title.toLowerCase().includes(q)) && (!kw || words(i.title).has(kw)));
  if (!rows.length) box.append(h('p', { className: 'empty', textContent: q || kw || srcPick ? 'No headlines match.' : 'Nothing here.' }));
  for (const i of rows) {
    const hrs = i.publishedAt ? (Date.now() - Date.parse(i.publishedAt)) / 36e5 : 6;
    const name = (i.src.type === 'aggregator' ? 'via ' : '') + i.src.name;
    box.append(h('div', { className: 'row a' + (hrs < 3 ? 0 : hrs < 12 ? 1 : 2) + (read.has(i.url) ? ' read' : '') },
      h('span', { className: 't', textContent: i.publishedAt ? ago(i.publishedAt) : '' }),
      h('div', {},
        h('a', { href: i.url, target: '_blank', rel: 'noopener noreferrer', textContent: i.title,
          onclick: e => markRead(e.currentTarget.closest('.row'), i.url), onauxclick: e => markRead(e.currentTarget.closest('.row'), i.url) }),
        h('button', { className: 'src', textContent: name, title: 'Only show ' + i.src.name, onclick: () => { srcPick = i.src.url; render(); } }))));
  }
  [...box.querySelectorAll('.row')].slice(0, 14).forEach((r, n) => r.style.setProperty('--i', n));
  return box;
}

function edit(c, field, label, cur) {
  const v = prompt(label, cur);
  if (v == null) return;
  over[c.url] = { ...over[c.url], [field]: v.trim() || undefined };
  saveOver(); render();
}

function render(enter) {
  const q = $('#q').value.trim().toLowerCase();
  const all = cards.map(c => ({ ...eff(c), raw: c })).filter(c => !c.hidden);
  const cats = [...new Set(all.map(c => c.category))];
  if (cat !== 'All' && !cats.includes(cat)) cat = 'All';
  $('#tabs').replaceChildren(...['All', ...cats].map(k => h('button', {
    textContent: k, ariaPressed: k === cat, onclick: () => { cat = k; kw = ''; store.set('cat', k); render(true); },
  })));
  $('#cats').replaceChildren(...cats.map(k => h('option', { value: k })));
  const inCat = all.filter(c => cat === 'All' || c.category === cat);
  const shown = inCat.filter(c => !off.has(c.url));
  if (srcPick && !shown.some(c => c.url === srcPick)) srcPick = '';
  // desktop opens every card; phones open only the first one on load
  for (const c of all) if (!known.has(c.url)) { known.add(c.url); if (!narrow() || (!seeded && c === shown[0])) openSet.add(c.url); }
  seeded = true;
  visible = shown.map(c => c.url);
  paintFold();
  const top = keywords(shown);
  $('#kws').replaceChildren(...(top.length ? [h('span', { textContent: 'Trending' }), ...top.map(([w, k]) => h('button', {
    ariaPressed: w === kw, onclick: () => { kw = kw === w ? '' : w; render(); },
  }, w, h('small', { textContent: k })))] : []));
  const seg = (cls, opts, cur, set) => h('div', { className: 'seg ' + cls }, ...opts.map(([v, label]) => h('button', {
    textContent: label, ariaPressed: v === cur, onclick: () => { set(v); render(true); },
  })));
  const pickName = shown.find(c => c.url === srcPick)?.name;
  const setOff = fn => { off.clear(); all.filter(fn).forEach(c => off.add(c.url)); store.set('off', [...off]); render(true); };
  const on = all.filter(c => !off.has(c.url)).length;
  $('#srcwrap').classList.toggle('closed', !srcsOpen);
  $('#srcs').replaceChildren(...all.map(c => h('button', {
    className: 'sq' + (inCat.includes(c) ? '' : ' ooc'), ariaPressed: !off.has(c.url),
    title: (c.error ? "Couldn't load · " : '') + c.name + (c.type === 'aggregator' ? ' (aggregator)' : ''),
    onclick: () => { off.has(c.url) ? off.delete(c.url) : off.add(c.url); store.set('off', [...off]); render(true); },
  }, h('span', { textContent: c.name }))));
  $('#view').replaceChildren(
    h('button', { className: 'hd', textContent: (srcsOpen ? '▾ ' : '▸ ') + 'Sources ' + on + '/' + all.length, onclick: () => { srcsOpen = !srcsOpen; store.set('srcsOpen', srcsOpen); render(); } }),
    h('button', { className: 'mini', textContent: 'All', onclick: () => setOff(() => false) }),
    h('button', { className: 'mini', textContent: 'None', onclick: () => setOff(() => true) }),
    h('button', { className: 'mini', textContent: 'Aggregators', onclick: () => setOff(c => c.type !== 'aggregator') }),
    h('button', { className: 'mini', textContent: 'Publishers', onclick: () => setOff(c => c.type === 'aggregator') }),
    ...(pickName ? [h('button', { className: 'pick', textContent: pickName + ' ×', title: 'Show all sources', onclick: () => { srcPick = ''; render(); } })] : []),
    h('span', { className: 'sp' }),
    ...(view === 'list' ? [seg('', [[0, 'Newest'], [7, 'Random week'], [30, 'Random month']], period, v => { seed = Math.random(); period = v; store.set('period', v); }),
      ...(period ? [h('button', { className: 'mini', textContent: 'Shuffle', onclick: () => { seed = Math.random(); render(true); } })] : [])] : []),
    seg('', [['list', 'List'], ['cards', 'Cards']], view, v => { view = v; store.set('view', v); }));
  $('#fold').hidden = view === 'list';
  $('#grid').className = (view === 'list' ? 'flat' : '') + (enter ? ' enter' : '');
  clearTimeout(enterT);
  if (enter) enterT = setTimeout(() => $('#grid').classList.remove('enter'), 1000);
  const els = view === 'list' ? [listEl(shown, q)] : shown.map(c => cardEl(c, q)).filter(Boolean);
  if (view !== 'list') els.forEach((el, i) => el.style.setProperty('--i', i));
  $('#grid').replaceChildren(...(els.length ? els : [h('p', { className: 'empty', textContent: q || kw ? 'No headlines match.' : 'Nothing here.' })]));
  const hid = all.length === cards.length ? [] : cards.map(c => ({ ...eff(c), raw: c })).filter(c => c.hidden);
  $('#hid').replaceChildren(...(hid.length ? ['Hidden: ', ...hid.map(c => h('button', {
    textContent: c.name + ' ↺', onclick: () => { over[c.url].hidden = false; saveOver(); render(); },
  }))] : []));
}

// theme
const themeBtn = $('#theme');
const paintTheme = () => themeBtn.textContent = document.documentElement.dataset.theme === 'dark' ? 'Light' : 'Dark';
themeBtn.onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; store.set('theme', t); paintTheme();
};
paintTheme();
$('#refresh').onclick = () => load(true);
$('#fold').onclick = () => {
  const anyOpen = visible.some(u => openSet.has(u));
  visible.forEach(u => anyOpen ? openSet.delete(u) : openSet.add(u));
  document.querySelectorAll('.card').forEach(el => el.classList.toggle('closed', anyOpen));
  paintFold();
};
$('#limit').value = limit;
$('#limit').onchange = e => { limit = +e.target.value; store.set('limit', limit); render(); };
$('#q').addEventListener('input', () => render());
document.addEventListener('click', e => document.querySelectorAll('.menu[open]').forEach(d => d.contains(e.target) || d.removeAttribute('open')));

addEventListener('scroll', () => $('.top').classList.toggle('scrolled', scrollY > 4), { passive: true });

// keyboard
addEventListener('keydown', e => {
  if (e.target.matches('input,textarea') || e.metaKey || e.ctrlKey || e.altKey || $('#panel').open) {
    if (e.key === 'Escape' && e.target.id === 'q') e.target.blur();
    return;
  }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'j' || e.key === 'k') {
    const links = [...document.querySelectorAll('.flat .row a, .card:not(.closed) .row a')];
    const i = links.indexOf(document.activeElement);
    const n = i < 0 ? 0 : Math.min(links.length - 1, Math.max(0, i + (e.key === 'j' ? 1 : -1)));
    links[n]?.focus();
  }
});

// add-source panel
let tok = 0, found = null;
const say = t => $('#msg').textContent = t;
$('#addbtn').onclick = () => { $('#c').value ||= cat === 'All' ? '' : cat; $('#panel').showModal(); $('#u').focus(); };
$('#close').onclick = () => $('#panel').close();
$('#u').addEventListener('input', debounce(async () => {
  const v = $('#u').value.trim(), t = ++tok;
  found = null; $('#add').disabled = true; $('#pv').replaceChildren();
  if (!v.includes('.')) return say('');
  say('Looking for a feed…');
  try {
    const d = await getJSON('/api/discover?url=' + encodeURIComponent(/^https?:/i.test(v) ? v : 'https://' + v));
    const [f] = await getJSON('/api/feeds?extra=' + encodeURIComponent(JSON.stringify([{ name: d.title || v, url: d.feed, category: 'x' }])));
    if (t !== tok) return;
    if (f.error) throw new Error(f.error);
    found = { url: d.feed, name: d.title || new URL(d.feed).hostname };
    $('#n').placeholder = found.name;
    say('Feed found. First headlines:');
    $('#pv').replaceChildren(...f.modes.Latest.slice(0, 3).map(i => h('li', { textContent: i.title })));
    $('#add').disabled = false;
  } catch (e) { if (t === tok) say(e.message); }
}, 600));
$('#add').onclick = () => {
  const category = $('#c').value.trim() || (cat === 'All' ? 'Other' : cat);
  if (cards.some(c => c.url === found.url)) return say('Already in your list.');
  mine.push({ name: $('#n').value.trim() || found.name, url: found.url, category }); saveMine();
  for (const id of ['u', 'n']) $('#' + id).value = '';
  found = null; $('#add').disabled = true; $('#pv').replaceChildren(); say('');
  $('#panel').close(); load();
};
$('#export').onclick = () => {
  $('#io').value = JSON.stringify(mine, null, 2);
  navigator.clipboard?.writeText($('#io').value).then(() => say('Copied. Paste into sources.json to make them permanent.'), () => {});
};
$('#import').onclick = () => {
  try {
    const list = JSON.parse($('#io').value);
    if (!Array.isArray(list) || list.some(s => !s || typeof s.url !== 'string')) throw 0;
    for (const s of list) if (!mine.some(m => m.url === s.url)) mine.push({ name: s.name || s.url, url: s.url, category: s.category || 'Other' });
    saveMine(); say('Imported ' + list.length + ' sources.'); load();
  } catch { say("That isn't a JSON list of sources."); }
};

load();
</script>
</body>
</html>
